<header class="header">
  <div class="container">
    <a routerLink="/" class="brand">
      <span class="brand-text">NY Albany Tamil Sangam</span>
    </a>
    <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="menuOpen=false">Home</a>
      <a routerLink="/events" routerLinkActive="active" (click)="menuOpen=false">Events</a>
      <a routerLink="/membership" routerLinkActive="active" (click)="menuOpen=false">Membership</a>
      <a routerLink="/gallery" routerLinkActive="active" (click)="menuOpen=false">Gallery</a>
      <a routerLink="/announcements" routerLinkActive="active" (click)="menuOpen=false">News</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="menuOpen=false">Contact</a>
      @if (authService.isAuthenticated()) {
        @if (authService.isAdmin()) {
          <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="menuOpen=false">Admin</a>
        }
        <a routerLink="/profile" routerLinkActive="active" (click)="menuOpen=false">Profile</a>
        <button class="btn-logout" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/auth/login" class="btn-login" (click)="menuOpen=false">Login</a>
      }
    </nav>
  </div>
</header>
