<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your NY Albany Tamil Sangam account</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com">
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="error">Valid email is required</span>
        }
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Your password">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="error">Password is required</span>
        }
      </div>
      <button type="submit" class="btn-submit" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <p class="switch-link">Don't have an account? <a routerLink="/auth/register">Register</a></p>
  </div>
</div>
